name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: glslang für die Vulkan-Shader
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Bauen
        env:
          MELONDS_KEYSTORE: ${{ secrets.MELONDS_KEYSTORE }}
          MELONDS_KEYSTORE_PASSWORD: ${{ secrets.MELONDS_KEYSTORE_PASSWORD }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2-licht ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          if [ -n "$MELONDS_KEYSTORE" ]; then
            # Leerzeichen/Zeilenumbrüche vom Einfügen am Handy entfernen
            # Längsten Base64-Block nehmen (falls versehentlich die ganze Datei eingefügt wurde)
            printf '%s' "$MELONDS_KEYSTORE" | grep -oE '[A-Za-z0-9+/=]{200,}' | awk '{ print length, $0 }' | sort -rn | head -1 | cut -d' ' -f2 | base64 -d > ${{ runner.workspace }}/keystore.jks || true
            PW=$(printf '%s' "$MELONDS_KEYSTORE_PASSWORD" | grep -oE '[a-f0-9]{32}' | head -1)
            [ -z "$PW" ] && PW=$(printf '%s' "$MELONDS_KEYSTORE" | grep -oE '(^|[^A-Za-z0-9+/])[a-f0-9]{32}($|[^A-Za-z0-9+/=])' | grep -oE '[a-f0-9]{32}' | tail -1)
            MELONDS_KEYSTORE_PASSWORD="$PW"
            echo "Keystore: $(wc -c < ${{ runner.workspace }}/keystore.jks) Bytes, Passwortlänge ${#PW}"
            keytool -list -keystore ${{ runner.workspace }}/keystore.jks -storepass "$MELONDS_KEYSTORE_PASSWORD" >/dev/null || { echo "::error::Keystore-Secret oder Passwort passt nicht"; exit 1; }
          else
            # Ohne Secret: Wegwerf-Schlüssel. Funktioniert, aber jedes Update muss dann neu installiert werden.
            echo "::warning::Kein MELONDS_KEYSTORE-Secret – APK wird mit Wegwerf-Schlüssel signiert."
            MELONDS_KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            keytool -genkeypair -keystore ${{ runner.workspace }}/keystore.jks -storepass $MELONDS_KEYSTORE_PASSWORD -keypass $MELONDS_KEYSTORE_PASSWORD -alias melonds -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=temp"
          fi
          echo "MELONDS_KEYSTORE=${{ runner.workspace }}/keystore.jks" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=$MELONDS_KEYSTORE_PASSWORD" >> local.properties
          chmod +x ./gradlew
          ./gradlew :app:regenerateVulkanSpirv :app:assembleGitHubNightlyRelease
          rm -f ${{ runner.workspace }}/keystore.jks

      - name: Release aktualisieren
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          prerelease: true
          commit: main
          tag: licht-latest
          name: 'WatermelonDS-Licht (aktuell)'
          body: 'Neuester Build von main. Licht & Schatten: Einstellungen → Video → Renderer Vulkan, „Light & shadow“ an.'
          artifacts: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk
          artifactContentType: application/vnd.android.package-archive
          removeArtifacts: true
